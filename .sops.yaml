# sops encryption policy: which recipients can decrypt secrets/*.yaml.
#
# Two kinds of recipient:
#   - admin: a portable age key (~/.config/sops/age/keys.txt) used to EDIT
#     secrets from a workstation. Back this key up; it's the master editor key.
#   - <host>: an age key DERIVED from each host's SSH ed25519 host key
#     (`ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub`). The host decrypts its
#     secrets at activation with its own host key — no extra key files.
#
# After installing a new host, derive its key, add it below, then re-encrypt:
#   sops updatekeys secrets/secrets.yaml
keys:
  - &admin age16ldf5l7p2kyxzqal0s9xcvc68wmcy5636uhxkde737t4h6hwluvq6d0kpn
  - &vm     age1tlsxm9tk0zcam05l9sx325u5jfy475xtatsue2xz366jm75qrs6qfguxqh
  # - &thinkpad  ageXXX   # add after installing the T14  (ssh-to-age its host key)
  # - &homelab   ageXXX   # add after installing the M75q
creation_rules:
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin
          - *vm
