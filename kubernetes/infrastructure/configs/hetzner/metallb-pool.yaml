# MetalLB address pool for HETZNER (prod). On Hetzner bare metal these are your
# ordered additional / failover IPs routed to the server — NOT a private LAN
# range. Confirm the model at setup (single failover IP vs a routed subnet); the
# advertisement may differ. <REPLACE with your Hetzner-assigned IP(s)>.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: hetzner-pool
  namespace: metallb-system
spec:
  addresses:
    - 203.0.113.10/32   # <REPLACE with your Hetzner additional/failover IP(s)>
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: hetzner-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - hetzner-pool
