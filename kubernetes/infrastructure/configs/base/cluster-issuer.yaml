# Let's Encrypt issuers (HTTP-01 solved through ingress-nginx). Apps request a
# cert by annotating their Ingress: cert-manager.io/cluster-issuer: letsencrypt-*.
# Use -staging while wiring things up (high rate limits, untrusted certs), then
# switch to -prod. These are cert-manager CRDs, so infra-configs dependsOn
# infra-controllers (see clusters/<cluster>/infrastructure.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: danielhoj@pm.me
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: danielhoj@pm.me
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
