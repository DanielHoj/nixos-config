# ingress-nginx — the Ingress controller. Its Service is type LoadBalancer, so
# MetalLB (see ../configs/<cluster>/metallb-pool.yaml) hands it a real routable
# IP. Set as the default IngressClass so app Ingresses need no explicit class.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes.github.io/ingress-nginx
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: "4.12.1"   # pin-and-verify at bootstrap
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: flux-system
  values:
    controller:
      service:
        type: LoadBalancer   # MetalLB assigns the external IP
      ingressClassResource:
        default: true
