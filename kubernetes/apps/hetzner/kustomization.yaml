# HETZNER (prod) overlay — same base, prod-scale patches. You promote a tested
# change by bumping the image tag here after it passes on homelab.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: myapp
resources:
  - ../base
replicas:
  - name: myapp
    count: 2
images:
  - name: ghcr.io/danielhoj/myapp
    newTag: latest   # <bump to the tested tag when promoting from homelab>
