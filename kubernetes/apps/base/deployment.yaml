# Placeholder for YOUR app — defined ONCE here; the homelab/hetzner overlays
# patch only what differs (replicas, image tag, host). Swap the image + ports
# for your real app when it exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  labels:
    app: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myapp
          image: ghcr.io/danielhoj/myapp:latest   # <REPLACE with your app image>
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
