# Flux entrypoint for the HETZNER (prod) cluster: reconcile the hetzner overlay.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  # Ingress controller + ClusterIssuers must exist before the app's Ingress.
  dependsOn:
    - name: infra-configs
  interval: 10m
  path: ./kubernetes/apps/hetzner
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # Decrypt any *.sops.yaml app secrets with the in-cluster age key.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
