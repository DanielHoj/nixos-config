# Flux entrypoint for the HETZNER (prod) cluster: reconcile the hetzner overlay.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/hetzner
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
