# Flux entrypoint for the HOMELAB cluster: reconcile the homelab app overlay.
# `flux bootstrap ... --path=kubernetes/clusters/homelab` drops the flux-system
# GitRepository + controllers next to this file; this Kustomization then points
# Flux at ../../apps/homelab.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/homelab
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
